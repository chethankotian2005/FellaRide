name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FellaRide.apk
      # Uploaded as a build artifact rather than published directly to a
      # Release here — that upload step hung indefinitely in practice, so
      # the release itself is created separately via the GitHub API.
      - uses: actions/upload-artifact@v4
        with:
          name: FellaRide-apk
          path: mobile/build/app/outputs/flutter-apk/FellaRide.apk
          retention-days: 90
